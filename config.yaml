story_source: json  # json | jira | clickup (futuro)

qdrant:
  url: ${QDRANT_URL}
  api_key: ${QDRANT_API_KEY}
  collections:
    user_stories: user_stories
    nfrs: non_functional_requirements
    test_scenarios: test_scenarios

llm:
  model: ${LLM_MODEL}
  api_key: ${LLM_API_KEY}
  base_url: ${LLM_BASE_URL}
  temperature: 0.7

embedding:
  model: all-MiniLM-L6-v2

providers:
  jira:
    url: ${JIRA_URL}
    email: ${JIRA_EMAIL}
    api_token: ${JIRA_API_TOKEN}
    project_key: SCRUM
    issue_type: Story

  # clickup:
  #   api_key: ${CLICKUP_API_KEY}
  #   space_id: xxx
  #   list_id: xxx

output:
  dir: data
  generate_docx: true
